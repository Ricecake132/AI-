const $ = id => document.getElementById(id);
const labels = ['필터 A','필터 B','입력 패턴'];
const cross = [[0,1,0],[1,1,1],[0,1,0]];
const diagonal = [[1,0,1],[0,1,0],[1,0,1]];
let matrices;
function mac(input, filter) {
  let total = 0;
  for(let i=0;i<input.length;i++){
    for(let j=0;j<input[i].length;j++) total += input[i][j]*filter[i][j];
  }
  return total;
}
function decide(a,b,left,right){
  if(Math.abs(a-b)<1e-9) return 'UNDECIDED';
  return a>b ? left : right;
}
function table(head,rows){
  const t=document.createElement('table');
  const h=t.createTHead().insertRow();
  for(const title of head){const cell=document.createElement('th');cell.textContent=title;h.append(cell);}
  const body=t.createTBody();
  for(const values of rows){const row=body.insertRow();for(const value of values)row.insertCell().textContent=value;}
  return t;
}
function calculate(){
  const [a,b,input]=matrices;
  const sa=mac(input,a), sb=mac(input,b);
  const winner=decide(sa,sb,'A','B');
  $('scores').textContent='A '+sa+'점 · B '+sb+'점 → '+(winner==='UNDECIDED'?'판정 불가 (동점)':'필터 '+winner);
  const rows=input.map((row,i)=>[(i+1)+'행',...[a,b].map(f=>{
    const terms=row.map((v,j)=>v+'×'+f[i][j]);
    return terms.join(' + ')+' = '+mac([row],[f[i]]);
  })]);
  $('steps').replaceChildren(table(['위치','입력 × A','입력 × B'],rows));
}
function reset(){
  matrices=[cross,diagonal,diagonal].map(m=>m.map(row=>row.slice()));
  $('cards').replaceChildren();
  matrices.forEach((m,k)=>{
    const card=document.createElement('div');card.className='card';
    const title=document.createElement('h2');title.textContent=labels[k];card.append(title);
    const grid=document.createElement('div');grid.className='grid';card.append(grid);
    m.forEach((row,i)=>row.forEach((v,j)=>{
      const cell=document.createElement('button');cell.className='cell';
      function paint(){cell.textContent=m[i][j];cell.setAttribute('aria-pressed',String(Boolean(m[i][j])));}
      cell.setAttribute('aria-label',labels[k]+' '+(i+1)+'행 '+(j+1)+'열');
      cell.onclick=()=>{m[i][j]=1-m[i][j];paint();calculate();};
      paint();grid.append(cell);
    }));
    $('cards').append(card);
  });
  calculate();
}
function analyze(){
  const data=JSON.parse($('dataset').textContent);
  let passed=0;
  const rows=Object.entries(data.patterns).map(([key,item])=>{
    const pair=data.filters[key.slice(0,key.lastIndexOf('_'))];
    const a=mac(item.input,pair.cross),b=mac(item.input,pair.x);
    const decision=decide(a,b,'Cross','X'), expected={'+':'Cross','x':'X'}[item.expected];
    const ok=decision===expected;if(ok)passed++;
    return [key,a,b,decision,expected,ok?'PASS':'FAIL'];
  });
  $('results').replaceChildren(table(['케이스','Cross 점수','X 점수','판정','expected','결과'],rows));
  $('report').textContent='총 '+rows.length+'건 · 통과 '+passed+'건 · 실패 '+(rows.length-passed)+'건';
}
function selectTab(batch){
  $('draw').hidden=batch;$('batch').hidden=!batch;
  $('drawTab').setAttribute('aria-pressed',String(!batch));$('dataTab').setAttribute('aria-pressed',String(batch));
  if(batch)analyze();
}
$('drawTab').onclick=()=>selectTab(false);$('dataTab').onclick=()=>selectTab(true);$('reset').onclick=reset;reset();
</script></html>
